# Managed by Puppet (profile::htcondor::ce_settings).
# Keep the execute node's benchmark attributes in the job history. Auditor reads
# them as MachineAttrApelSpecs0 (HEPSCORE, HEPscore23, SI2K). They used to come
# from the htcondor-ce-apel package; do not depend on that package.
SYSTEM_JOB_MACHINE_ATTRS = $(SYSTEM_JOB_MACHINE_ATTRS) ApelSpecs ApelScaling
SYSTEM_JOB_MACHINE_ATTRS_HISTORY_LENGTH = 1
