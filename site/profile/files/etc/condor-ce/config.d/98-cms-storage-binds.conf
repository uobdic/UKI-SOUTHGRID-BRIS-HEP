# Run after the packaged Env transform, which rebuilds the routed environment.
JOB_ROUTER_POST_ROUTE_TRANSFORM_NAMES = $(JOB_ROUTER_POST_ROUTE_TRANSFORM_NAMES) CmsStorageBinds

JOB_ROUTER_TRANSFORM_CmsStorageBinds @=end
    REQUIREMENTS x509UserProxyVOName =?= "cms"
    EVALSET CmsBindEntries join("\n", argsToList(Environment ?: ""))
    EVALSET CmsApptainerBinds regexps("(?m)^APPTAINER_BINDPATH=([^\n]*)", CmsBindEntries, "\\1")
    EVALSET CmsSingularityBinds regexps("(?m)^SINGULARITY_BINDPATH=([^\n]*)", CmsBindEntries, "\\1")
    EVALSET CmsOriginalBinds ifThenElse(isString(CmsApptainerBinds) && CmsApptainerBinds != "", CmsApptainerBinds, CmsSingularityBinds ?: "")
    EVALSET CmsStorageBinds ifThenElse(CmsOriginalBinds == "", "/xrootd/cms:/xrootd/cms:ro", ifThenElse(stringListMember("/xrootd/cms:/xrootd/cms:ro", CmsOriginalBinds, ","), CmsOriginalBinds, strcat(CmsOriginalBinds, ",/xrootd/cms:/xrootd/cms:ro")))
    EVALSET Environment mergeEnvironment(Environment, listToArgs({strcat("APPTAINER_BINDPATH=", CmsStorageBinds), strcat("SINGULARITY_BINDPATH=", CmsStorageBinds)}))
    DELETE CmsBindEntries
    DELETE CmsApptainerBinds
    DELETE CmsSingularityBinds
    DELETE CmsOriginalBinds
    DELETE CmsStorageBinds
@end
