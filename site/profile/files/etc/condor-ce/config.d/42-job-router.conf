# HTCondor-CE job routes (managed by Puppet, profile::htcondor::ce_settings).
#
# One route per VO, plus "other" for everything no route takes. Settings that all
# routes share are in the Base transform. The accounting group is finally set by
# the schedd (/etc/condor/mapfiles.d/00-local.conf), see
# profile::htcondor::ce_settings::accounting_map.

JOB_DEFAULT_REQUESTMEMORY = IfThenElse(MemoryUsage =!= UNDEFINED,MemoryUsage,2200)

# default maximum number of jobs per route, and how many may be idle before the
# route is no longer used
JOB_ROUTER_DEFAULT_MAX_JOBS_PER_ROUTE = 200
JOB_ROUTER_DEFAULT_MAX_IDLE_JOBS_PER_ROUTE = 10

# This could be made an attribute of the job, rather than being hard-coded
ROUTED_JOB_MAX_TIME = 1440

# only vanilla and grid universe jobs are routed
JOB_ROUTER_SOURCE_JOB_CONSTRAINT = (target.JobUniverse =?= 5 || target.JobUniverse =?= 1)
JOB_ROUTER_NAME = htcondor-ce

# pre-route transforms: what all routes do
JOB_ROUTER_PRE_ROUTE_TRANSFORM_NAMES = Base Cleanup OrigRequests

JOB_ROUTER_TRANSFORM_Base @=jrt
   SET RoutedJob True
   SET Requirements True
   DELETE SUBMIT_Iwd
   SET default_maxMemory 3000
   SET WantIOProxy true
   # a route may replace this (lhcb)
   EVALSET AccountingGroup strcat("group_",x509userproxyvoname,".",Owner)
@jrt

JOB_ROUTER_TRANSFORM_Cleanup @=jrt
    # If the batch condor job is removed then the CE will resubmit the
    # job and we want to void that
    DELETE PeriodicRemove
    DELETE TotalSubmitProcs
@jrt

JOB_ROUTER_TRANSFORM_OrigRequests @=jrt
    # The AuthToken* attributes can't be sent on to the destination schedd, so we rename them here
    RENAME /^AuthToken.*$/          orig_\0
    # Copy original, incoming job attributes for use in post transforms
    COPY /^OnExitHold.*$/          orig_\0
    COPY BatchRuntime              orig_BatchRuntime
    COPY environment               orig_environment
    # Preserve selected X.509 identity/accounting metadata for downstream accounting/reporting
    COPY x509UserProxyFirstFQAN     orig_x509UserProxyFirstFQAN
    COPY x509UserProxyVOName        orig_x509UserProxyVOName
    COPY VoName                     orig_VoName
    COPY x509UserProxyFQAN          orig_x509UserProxyFQAN
    COPY x509userproxysubject       orig_x509userproxysubject
    # the BLAHP uses WholeNodes=true for the same thing that we use WantWholeNode=true
    COPY WantWholeNode             WholeNodes

    # Support whole node job requests against HTCondor pools if the source job specifies 'WantWholeNode = True'
    # 'if' can't handle complex expressions yet so we evaluate it here for use in post-transforms
    EVALMACRO test_want_whole_node $(MY.WantWholeNode:False)
@jrt

JOB_ROUTER_ROUTE_NAMES = \
   atlas cms dune gridpp ilc lhcb \
   lsst lz ops mu3e na62 eucliduk other

JOB_ROUTER_ROUTE_atlas @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "atlas")
@jre

JOB_ROUTER_ROUTE_cms @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "cms")
@jre

JOB_ROUTER_ROUTE_dune @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "dune")
@jre

JOB_ROUTER_ROUTE_gridpp @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "gridpp")
@jre

JOB_ROUTER_ROUTE_ilc @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "ilc")
@jre

JOB_ROUTER_ROUTE_lhcb @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "lhcb") || (regexp(".*lhcb.*", Owner)) || (regexp(".*lhcb.*", AuthTokenSubject))
   SET DICE_TESTING "YES"
   EVALSET AccountingGroup strcat("group_lhcb.", Owner)
@jre

JOB_ROUTER_ROUTE_lsst @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "lsst")
@jre

JOB_ROUTER_ROUTE_lz @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "lz")
@jre

JOB_ROUTER_ROUTE_ops @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "ops")
@jre

JOB_ROUTER_ROUTE_mu3e @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "mu3e.org")
@jre

JOB_ROUTER_ROUTE_na62 @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "na62.vo.gridpp.ac.uk")
@jre

JOB_ROUTER_ROUTE_eucliduk @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   REQUIREMENTS (x509UserProxyVOName == "eucliduk.net")
@jre

JOB_ROUTER_ROUTE_other @=jre
   UNIVERSE VANILLA
   TargetUniverse = 5
   # everything that no other route takes: keep this list in step with the routes above
   REQUIREMENTS (x509UserProxyVOName =!= "atlas") && (x509UserProxyVOName =!= "cms") && (x509UserProxyVOName =!= "dune") && (x509UserProxyVOName =!= "gridpp") && (x509UserProxyVOName =!= "ilc") && (x509UserProxyVOName =!= "lhcb") && (x509UserProxyVOName =!= "lsst") && (x509UserProxyVOName =!= "lz") && (x509UserProxyVOName =!= "ops") && (x509UserProxyVOName =!= "mu3e.org") && (x509UserProxyVOName =!= "na62.vo.gridpp.ac.uk") && (x509UserProxyVOName =!= "eucliduk.net") && (regexp(".*lhcb.*", Owner) =!= true) && (regexp(".*lhcb.*", AuthTokenSubject) =!= true)
@jre
