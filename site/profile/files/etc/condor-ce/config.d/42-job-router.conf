##### Route 1
JOB_ROUTER_ROUTE_atlas @=jre
   UNIVERSE VANILLA
   REQUIREMENTS (x509UserProxyVOName == "atlas")
   DELETE SUBMIT_Iwd
   # set_* rules
   SET default_maxMemory 3000
   SET WantIOProxy true
   # eval_set_* rules
   EVALSET AccountingGroup strcat("group_",x509userproxyvoname,".",Owner)
@jre

##### Route 2
JOB_ROUTER_ROUTE_cms @=jre
   UNIVERSE VANILLA
   REQUIREMENTS (x509UserProxyVOName == "cms")
   # autoconversion of route 'dice_cms_centos7' from old route syntax
   # delete_* rules
   DELETE SUBMIT_Iwd
   # set_* rules
   SET default_maxMemory 3000
   SET WantIOProxy true
   # eval_set_* rules
   EVALSET AccountingGroup strcat("group_",x509userproxyvoname,".",Owner)
   tmp.bindpath = "/xrootd/cms,/cvmfs"
   tmp.apptainer_bindpath = APPTAINER_BINDPATH=$(tmp.bindpath)
   # for backwards compatibility
   tmp.singularity_bindpath = SINGULARITY_BINDPATH=$(tmp.bindpath)
   SET Environment "$(tmp.apptainer_bindpath) $(tmp.singularity_bindpath) $(MY.orig_environment)"
@jre

