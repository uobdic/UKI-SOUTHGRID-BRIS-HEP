
# define a global constraint, only jobs that match this will be considered for routing
# JOB_ROUTER_SOURCE_JOB_CONSTRAINT = WantJobRouter

JOB_DEFAULT_REQUESTMEMORY = IfThenElse(MemoryUsage =!= UNDEFINED,MemoryUsage,2200)
# define a default maximum number of jobs that will be matched to each route
# and a limit on the number of idle jobs a route may have before we stop using it.
JOB_ROUTER_DEFAULT_MAX_JOBS_PER_ROUTE = 200
JOB_ROUTER_DEFAULT_MAX_IDLE_JOBS_PER_ROUTE = 10

# This could be made an attribute of the job, rather than being hard-coded
ROUTED_JOB_MAX_TIME = 1440

#JOB_ROUTER_SOURCE_JOB_CONSTRAINT = (target.x509userproxysubject =!= UNDEFINED) && (target.x509UserProxyExpiration =!= UNDEFINED) && (time() < target.x509UserProxyExpiration) && (target.JobUniverse =?= 5 || target.JobUniverse =?= 1)
JOB_ROUTER_SOURCE_JOB_CONSTRAINT = (target.JobUniverse =?= 5 || target.JobUniverse =?= 1)
JOB_ROUTER_NAME = htcondor-ce
# define a pre-route transform that does the transforms all routes should do
JOB_ROUTER_PRE_ROUTE_TRANSFORM_NAMES = Base Cleanup OrigRequests


JOB_ROUTER_TRANSFORM_Base @=jrt
   # remove routed job if it goes on hold or stays idle for over 6 hours
   SET PeriodicRemove = JobStatus == 5 || (JobStatus == 1 && (time() - QDate) > 3600*6))
   # delete the global SOURCE_JOB_CONSTRAINT attribute so that routed jobs will not be routed again
   # DELETE WantJobRouter
#   SET RequestDisk = 100000000
   SET RoutedJob True
   SET Requirements True
@jrt

JOB_ROUTER_TRANSFORM_Cleanup @=jrt
    # If the batch condor job is removed then the CE will resubmit the
    # job and we want to void that
    DELETE PeriodicRemove
    DELETE TotalSubmitProcs
@jrt


JOB_ROUTER_TRANSFORM_OrigRequests @=jrt
    # The AuthToken* attributes can't be sent on to the destination schedd, so we rename them here
    RENAME /^AuthToken.*$/          orig_\0
    # Copy original, incoming job attributes for use in post transforms
    COPY /^OnExitHold.*$/          orig_\0
    COPY BatchRuntime              orig_BatchRuntime
    COPY environment               orig_environment
    # Preserve selected X.509 identity/accounting metadata for downstream accounting/reporting
    COPY x509UserProxyFirstFQAN     orig_x509UserProxyFirstFQAN
    COPY x509UserProxyVOName        orig_x509UserProxyVOName
    COPY x509UserProxyFQAN          orig_x509UserProxyFQAN
    COPY x509userproxysubject       orig_x509userproxysubject
    # the BLAHP uses WholeNodes=true for the same thing that we use WantWholeNode=true
    COPY WantWholeNode             WholeNodes

    # Support whole node job requests against HTCondor pools if the source job specifies 'WantWholeNode = True'
    # 'if' can't handle complex expressions yet so we evaluate it here for use in post-transforms
    EVALMACRO test_want_whole_node $(MY.WantWholeNode:False)
@jrt

JOB_ROUTER_ROUTE_NAMES = \
   atlas cms dune gridpp dilc lhcb \
   lsst lz ops mu3e na62 eucliduk other

