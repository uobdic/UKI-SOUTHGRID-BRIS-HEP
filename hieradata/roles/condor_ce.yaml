classes:
  - profile::htcondor::ce_settings
  - profile::firewalld
  - profile::cephfs
  - profile::grid_cert
  - 'profile::backed_up'
  - profile::users::poolaccounts

site::node_info:
  users: poolaccounts

profile::users::shell: '/sbin/nologin'

firewalld::ports:
  "Open port 9618 for condor":
    ensure: present
    zone: public
    port: 9618
    protocol: 'tcp'
  "Open port 9619 for condor-ce":
    ensure: present
    zone: public
    port: 9619
    protocol: 'tcp'

firewalld::services:
  "Allow access to HTTP service on port 80 for CEView (internal only)":
    service: http
    zone: public
    ensure: present

profile::cephfs::keys:
  - dice-user

profile::cephfs::mounts:
  '/condor':
    device: dice-user@.dicefs=/condor
    ensure: absent
  '/dice':
    device: dice-user@.dicefs=/dice
  '/xrootd':
    device: dice-user@.dicefs=/xrootd

# Schedd fallback accounting groups (AssignAccountingGroup), first match wins.
# Supported VOs without an entry here trigger a warning in the Puppet run.
profile::htcondor::ce_settings::default_group: group_physics
profile::htcondor::ce_settings::accounting_map:
  - {pattern: '/^atlas[0-9]+$/', group: group_atlas, vo: atlas}
  - {pattern: cmssgm, group: 'group_cms.admin,group_cms.cmssgm', vo: cms}
  - {pattern: '/^cms.*/', group: group_cms, vo: cms}
  - {pattern: '/^lhcb.*/', group: group_lhcb, vo: lhcb}
  - {pattern: '/^lz.*/', group: group_lz, vo: lz}
  - {pattern: '/^na62.*/', group: group_na62, vo: na62.vo.gridpp.ac.uk}
  - {pattern: '/^dteam.*/', group: group_dteam, vo: dteam}
  - {pattern: '/^ops.*/', group: group_ops, vo: ops}

# VoName for token-only jobs, by token issuer (seen on lcgce02 on 23 November 2026).
# Add further issuers here; jobs from unlisted issuers get no VoName.
profile::htcondor::ce_settings::token_issuer_vos:
  'https://cms-auth.cern.ch/': cms
  'https://cilogon.org/dune': dune
