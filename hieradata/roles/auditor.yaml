---
classes:
  - profile::auditor
  - profile::auditor::htcondor_client
  - profile::auditor::htcondor_collector
  - profile::auditor::apel_publisher

# Auditor accounting VM defaults. Node-specific and secret settings are in the
# private repository.
profile::auditor::data_dir: /data
profile::auditor::journal_max_use: 500M
profile::auditor::postgresql_version: '17'
profile::auditor::auditor_version: '0.11.2-1'
profile::auditor::htcondor_collector::pool: htc01.dice.priv
profile::auditor::htcondor_collector::schedd_names:
  - lcgce02.phy.bris.ac.uk
profile::auditor::htcondor_collector::site_name: UKI-SOUTHGRID-BRIS-HEP
# AUDITOR#2023 workaround: drop jobs held for more than ~3 h before removal (their
# recorded runtime includes the held time). Remove once the upstream fix is released.
profile::auditor::htcondor_collector::max_overrun: 10800
# Local schedds: collected into Auditor for reports, never published to APEL
# (sites_to_report below lists only the grid site). The schedd list
# (local_schedd_names) is in the private repository, node data of the auditor.
profile::auditor::htcondor_collector::local_site_name: DICE-LOCAL
profile::auditor::htcondor_collector::local_record_prefix: htcondor-local
# Publishing to APEL stays off until an operator has reviewed a dry run.
profile::auditor::apel_publisher::publish_enabled: false
profile::auditor::apel_publisher::benchmark_type: HEPscore23
profile::auditor::apel_publisher::sites_to_report:
  UKI-SOUTHGRID-BRIS-HEP:
    - UKI-SOUTHGRID-BRIS-HEP
